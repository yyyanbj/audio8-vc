name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      provider:
        description: "ONNX Runtime execution provider(s) to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - cpu
          - dml
          - cuda
      bundle_models:
        description: "Bundle Audio8-0.1B + SenseVoice ASR + Silero VAD into offline installer (~500 MB)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Build Matrix
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.matrix.outputs.providers }}
      has_cpu: ${{ steps.matrix.outputs.has_cpu }}
    steps:
      - name: Determine provider matrix
        id: matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.provider }}" != "all" ]]; then
            echo 'providers=["${{ inputs.provider }}"]' >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.provider }}" == "cpu" ]]; then
              echo "has_cpu=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_cpu=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'providers=["cpu","dml","cuda"]' >> "$GITHUB_OUTPUT"
            echo "has_cpu=true" >> "$GITHUB_OUTPUT"
          fi

  lint-and-test:
    name: Lint, Self-Check & Unit Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies (all + dev)
        run: uv sync --extra all --extra dev

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run Audio8-VC project lint suite
        run: uv run a8vc lint

      - name: Run Audio8-VC runtime self-check
        run: uv run a8vc self-check

      - name: Run pytest suite
        run: uv run pytest -v

  build-windows:
    name: Windows x64 (${{ matrix.provider }})
    needs: [prepare, lint-and-test]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.prepare.outputs.providers) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Run lint, self-check, and unit test suite
        shell: pwsh
        run: |
          uv sync --extra windows --extra dev
          uv run ruff check .
          uv run a8vc lint
          uv run a8vc self-check
          uv run pytest -v

      - name: Build Audio8-VC Windows installer & portable ZIP (${{ matrix.provider }})
        shell: pwsh
        run: |
          $params = @{
            Provider = "${{ matrix.provider }}"
          }
          if ("${{ inputs.bundle_models }}" -eq "true") {
            $params.BundleModels = $true
          }
          & .\packaging\windows\build_windows.ps1 @params

      - name: Smoke-test generated Windows setup installer (${{ matrix.provider }})
        shell: pwsh
        run: |
          $provider = "${{ matrix.provider }}"
          $setup = Get-ChildItem -Path "dist\release" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "Expected Inno Setup installer (*-setup.exe) not found in dist\release"
          }
          $testDir = Join-Path $env:RUNNER_TEMP "Audio8-VC-InstallTest-$provider"
          Write-Host "Silently installing $($setup.Name) into $testDir ..."
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER",
            "/DIR=$testDir"
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Silent installer exited with code $($proc.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $testDir "Audio8-VC.exe"))) {
            throw "Installed Audio8-VC.exe missing under $testDir"
          }
          $cli = Join-Path $testDir "a8vc.exe"
          & $cli --version
          if ($LASTEXITCODE -ne 0) {
            throw "Installed a8vc.exe --version failed with code $LASTEXITCODE"
          }
          $infoRaw = & $cli info --json
          if ($LASTEXITCODE -ne 0) {
            throw "Installed a8vc.exe info --json failed with code $LASTEXITCODE"
          }
          Write-Host $infoRaw
          $info = ($infoRaw -join "`n") | ConvertFrom-Json
          if ($info.configured_provider -ne $provider) {
            throw "Installed configured_provider mismatch: expected '$provider', got '$($info.configured_provider)'"
          }
          if ($info.asr_provider -ne "cpu") {
            throw "Installed asr_provider mismatch: expected 'cpu', got '$($info.asr_provider)'"
          }
          if ($provider -eq "dml" -and ($info.available_providers -notcontains "DmlExecutionProvider")) {
            throw "Installed DirectML build missing DmlExecutionProvider"
          }
          if ($provider -eq "cuda" -and ($info.available_providers -notcontains "CUDAExecutionProvider")) {
            throw "Installed CUDA build missing CUDAExecutionProvider"
          }
          & $cli self-check
          if ($LASTEXITCODE -ne 0) {
            throw "Installed a8vc.exe self-check failed with code $LASTEXITCODE"
          }
          & $cli voice list
          if ($LASTEXITCODE -ne 0) {
            throw "Installed a8vc.exe voice list failed with code $LASTEXITCODE"
          }
          & $cli voice builtins
          if ($LASTEXITCODE -ne 0) {
            throw "Installed a8vc.exe voice builtins failed with code $LASTEXITCODE"
          }
          $builtinsRaw = & $cli voice builtins --json
          if ($LASTEXITCODE -ne 0) {
            throw "Installed a8vc.exe voice builtins --json failed with code $LASTEXITCODE"
          }
          $builtins = @(($builtinsRaw -join "`n") | ConvertFrom-Json)
          if ($builtins.Count -lt 15) {
            throw "Expected at least 15 bundled built-in voices in installed build, got $($builtins.Count)"
          }
          Write-Host "Verified $($builtins.Count) bundled built-in voices in installed build."
          & $cli devices
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "a8vc.exe devices returned $LASTEXITCODE (expected on headless runner without audio endpoints)"
            $global:LASTEXITCODE = 0
          }
          $uninstaller = Join-Path $testDir "unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/NORESTART") -Wait
          }

      - name: Upload Windows release artifacts (${{ matrix.provider }})
        uses: actions/upload-artifact@v4
        with:
          name: Audio8-VC-windows-x64-${{ matrix.provider }}
          path: |
            dist/release/*-setup.exe
            dist/release/*-portable.zip
          if-no-files-found: error

  verify-windows-cpu-matrix:
    name: Verify Windows CPU Matrix (${{ matrix.label }})
    needs: [prepare, build-windows]
    if: needs.prepare.outputs.has_cpu == 'true'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Win10 baseline (Server 2022)
          - os: windows-2025
            label: Win11 24H2 baseline (Server 2025)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync lightweight E2E runner dependencies
        shell: pwsh
        run: uv sync --extra download --extra dev

      - name: Download built Windows CPU artifacts
        uses: actions/download-artifact@v4
        with:
          name: Audio8-VC-windows-x64-cpu
          path: artifacts_cpu

      - name: Cache Audio8-0.1B + SenseVoice ASR + Silero VAD models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/a8vc-models-cache
          key: a8vc-models-v1-audio8-sensevoice-silero

      - name: Run full installer + portable + real-model + headless browser E2E
        shell: pwsh
        run: |
          $verifyParams = @{
            ArtifactDir    = (Join-Path $PWD "artifacts_cpu")
            ModelsCacheDir = (Join-Path $env:RUNNER_TEMP "a8vc-models-cache")
            Provider       = "cpu"
            OrtVersion     = "1.24.4"
          }
          & .\packaging\windows\verify_windows_e2e.ps1 @verifyParams

  release:
    name: Publish GitHub Release (CPU + DirectML GPU + CUDA GPU)
    needs: [build-windows, verify-windows-cpu-matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Audio8-VC-windows-x64-*
          path: release_staging
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        shell: bash
        run: |
          cd release_staging
          ls -lh
          sha256sum Audio8-VC-*.exe Audio8-VC-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_staging/Audio8-VC-*.exe
            release_staging/Audio8-VC-*.zip
            release_staging/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ### 内置 15 款开源音色预设（开箱即用）

            安装包已内置 **15 款精选开源 `.a8voice` 音色**（涵盖二次元、游戏角色、中文精选、英文精选，总计仅 ~47 KB），首次启动自动初始化，也可在界面「内置开源音色库」页签按分类筛选或一键恢复。

            ### Windows 安装包版本选择指南

            - **DirectML GPU 通用版 (`*-win64-dml-setup.exe` / `-portable.zip`) — 推荐大多数 Windows 显卡用户**
              - 支持 **NVIDIA / AMD / Intel** DirectX 12 显卡加速，**无需手动安装 CUDA 或 cuDNN**，安装即用。
            - **NVIDIA CUDA GPU 加速版 (`*-win64-cuda-setup.exe` / `-portable.zip`) — NVIDIA RTX 进阶用户**
              - 基于 `onnxruntime-gpu`（CUDA 12 + cuDNN 9），自动探测系统 `CUDA_PATH`、`C:\Program Files\NVIDIA\CUDNN\v9.*` 及程序目录 `cuda_libs`；若未检测到 CUDA 12 / cuDNN 9 运行库将自动安全回退 CPU。
            - **CPU 轻量通用版 (`*-win64-cpu-setup.exe` / `-portable.zip`)**
              - 体积最小、零显卡驱动要求，纯 CPU 运行仅约 0.6 GiB RAM。

            > 首次启动后可在桌面界面点击「**一键下载所需模型**」（内置国内 `hf-mirror.com` 加速镜像选项）。
