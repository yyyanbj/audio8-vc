# Audio8 Real-Time Voice Changer 默认配置
# 可复制为 configs/local.toml 或通过环境变量 A8VC_* / CLI 参数覆盖

[paths]
model_dir = "models/audio8-tts-0.1b-onnx-int8"
voices_dir = "voices"
asr_model_dir = "models/asr"
vad_model_path = "models/vad/silero_vad.onnx"

[runtime]
# ONNX Execution Provider: "cpu" | "cuda" | "coreml" | "dml" | "auto"
provider = "cpu"
# 总 CPU 线程预算，0 表示自动按物理核心 sizing（启用共享全局线程池避免多池空转抢占）
threads = 0
# Slow/Fast AR 独立线程数（0 表示自动共享全局线程池；显式 >0 则切换每会话独立线程池）
ar_threads = 0
# Codec 解码器独立线程数（0 表示自动共享全局线程池；GPU 模式下仅用于 CPU 回退）
codec_threads = 0
# 启用进程级共享 ONNX Runtime 线程池（Slow/Fast AR 与 Codec 动态工作窃取，最大化最小延迟与吞吐）
use_global_thread_pool = true
precision = "int8"
codec_precision = "fp16"
# 内存级 LRU 前缀状态缓存容量（每条约 10~12 MB，显著降低重复 prefill 延迟）
prefix_cache_size = 4
# Slow-AR KV-Cache 零损耗压缩长度（2048 -> 512，输出逐比特等价，4x 减少无效 KV 拷贝，超长句自动无感扩展回 2048）
slow_kv_max_seq_len = 512
# 首包触发帧数（2 帧 ≈ 93ms，配合 256 采样 5.8ms 极短重叠淡变与 2->4->8->12 渐进升块，极致压缩首字延迟 TTFA）
first_chunk_frames = 2
# 稳态流式解码块大小（帧，21.53 fps；从首包 2 帧翻倍渐进至 12 帧，消除稳态卡顿并最小化 CPU RTF）
chunk_frames = 12
# 滑窗解码上下文帧数（4 帧上下文 + 5.8ms 升余弦重叠淡变，极速 CPU 解码同时无接缝爆音）
stream_context_frames = 4
stream_guard_frames = 0
# 启用 AR 生成与 Codec 解码双线程流水线并行，隐藏解码延迟
pipeline_decode = true
# 采样参数
temperature = 0.7
top_p = 0.9
top_k = 50
max_new_tokens = 512

[audio]
input_sample_rate = 16000
output_sample_rate = 44100
input_block_ms = 16
input_device = ""
output_device = ""
# 句段边界淡入淡出时长（ms），消除起止爆音且不增加句内延迟
crossfade_ms = 6

[vad]
# "auto" (有 silero_vad.onnx 用 Silero，否则退回内置能量 VAD) | "energy" | "silero"
backend = "auto"
energy_threshold_db = -38.0
speech_start_ms = 64
min_silence_ms = 192
pre_speech_ms = 128
min_segment_ms = 192
max_segment_ms = 2600

[asr]
# "sherpa" | "mock"
backend = "sherpa"
# "sense_voice" | "paraformer" | "zipformer"
model_type = "sense_voice"
language = "auto"
num_threads = 2
provider = "cpu"

[engine]
# "cascaded" (Track 1: 零训练即用) | "codec_s2s" (Track 2: 原生 Codec 空间实验/微调引擎)
mode = "cascaded"
# 仅保留最新 1 段待合成语音，严格杜绝积压雪崩保证最低端到端延迟
max_pending_segments = 1

[server]
host = "127.0.0.1"
port = 8025
default_voice = ""
